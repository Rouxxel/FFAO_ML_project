# @package dataset
# Stage 1 — small Re=100 Zenodo cylinder flow (see documentation/DATA_SOURCES.md)

stage: 1
source_id: zenodo_re100
zenodo_record: "18669296"
related_code_url: https://github.com/LucaAddiucci/Physics-Constrained-Convolutional-Autoencoders

re: 100
output_root: ${paths.dataset_root}
simulation_id: re_100_zenodo

# Time-based split within a single trajectory (151 snapshots typical).
# Indices are inclusive start, exclusive end on time dimension after import.
temporal_split:
  strategy: by_time_index
  train: [0, 105]
  val: [105, 128]
  test: [128, 151]

# Multi-Re lists in splits.yaml are inactive until Stage 3 or own multi-Re CFD.
use_re_splits: false

normalization:
  fit_split: train
  per_channel: true
