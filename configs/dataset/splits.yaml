# @package dataset
# Stage 3 / own multi-Re CFD — simulation-level Reynolds splits (PRD §11).
# For Stage 1 (Zenodo Re=100 only), use dataset/stage1_zenodo.yaml instead.

stage: 3
source_id: own_cfd_or_cfdbench
use_re_splits: true

output_root: ${paths.dataset_root}

train_re:
  - 50
  - 75
  - 100
  - 150
  - 200

val_re:
  - 125
  - 175

test_re:
  - 250
  - 300
  - 400

normalization:
  fit_split: train
  per_channel: true
