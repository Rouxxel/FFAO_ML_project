# @package dataset
# Stage 3 Re-list template — stub multi-Re CFD and tests (PRD §11).
# For CFDBench imports use dataset/stage3_cfdbench.yaml (same Re lists + import metadata).
# For Stage 1 (Zenodo Re=100 only), use dataset/stage1_zenodo.yaml instead.

stage: 3
source_id: own_cfd_or_cfdbench
use_re_splits: true

output_root: ${paths.dataset_root}

train_re:
  - 50
  - 75
  - 100
  - 150
  - 200

val_re:
  - 125
  - 175

test_re:
  - 250
  - 300
  - 400

# Shared time window per simulation (all Re in metadata must cover these indices).
temporal_split:
  strategy: by_time_index
  train: [0, 80]
  val: [0, 90]
  test: [0, 100]

prediction:
  delta_steps: 1

normalization:
  fit_split: train
  per_channel: true
