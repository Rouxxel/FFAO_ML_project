# Hydra root — compose with: hydra compose (from repo root, config path configs)

defaults:
  - simulation: cylinder_base
  - dataset: splits
  - model: cnn
  - train: default
  - _self_

seed: 42

paths:
  dataset_root: dataset
  runs_root: results/runs

hydra:
  run:
    dir: ${paths.runs_root}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${paths.runs_root}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
