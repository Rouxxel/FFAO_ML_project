# @package train

batch_size: 8
learning_rate: 1.0e-3
epochs: 100
checkpoint_every: 10
num_workers: 0

device: cpu

loss:
  field_mse: true
  divergence_weight: 0.0

# Grid spacing for divergence penalty (PRD §14 Exp. 5); override from simulation attrs.
physics:
  dx: 1.0
  dy: 1.0

# ConvLSTM: unroll_steps > 1 enables truncated multi-step training loss.
unroll_steps: 1
teacher_forcing: true
