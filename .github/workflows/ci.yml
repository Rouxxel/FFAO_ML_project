# Python quality gate — see documentation/setup/CI.md
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (core + dev)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[core,dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Verify Hydra dataset configs are present
        run: |
          test -f configs/dataset/stage1_zenodo.yaml
          test -f configs/dataset/splits.yaml

      - name: Unit tests
        run: pytest -m "not slow and not gpu and not cfd"

      - name: Verify editable package metadata
        run: python -c "import ffaoml; assert ffaoml.__version__"

  package:
    runs-on: ubuntu-24.04
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install for audit
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[core,dev]"

      - name: pip audit (high)
        run: pip audit --desc on --severity high
        continue-on-error: true

      - name: Block committed env files
        run: test ! -f .env

      - name: Block obvious secret patterns in source
        run: |
          ! grep -RInE '(PRIVATE KEY-----|postgresql://|api[_-]?key\s*=\s*["'"'"'][^"'"'"']+["'"'"'])' \
            --include='*.py' --include='*.yaml' --include='*.yml' \
            src tests configs scripts documentation || \
            (echo "Forbidden secret pattern in application sources." && exit 1)
